<title>Larsens Autowerkstatt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Saira:wght@300;400;500;600&display=swap">
<style>
/* Layout: 3D-Bühne füllt den Raum, Werkbank-Panel rechts (Desktop) bzw. unten (Handy). Ein einziger dunkler Showroom-Look. */
:root{
  color-scheme:dark;
  --bg:#0b0e13; --panel:#11151c; --raise:#1e2631; --line:#2a323e;
  --fg:#eef2f6; --mute:#8c97a6; --accent:#ffb020; --accent-ink:#1b1300; --ice:#7cd4ff; --stop:#ff4d4d;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Saira","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--body);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#boot{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .45s}
#boot.out{opacity:0;pointer-events:none}
#boot b{font:800 30px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
#boot span{color:var(--mute);font-size:14px}
#boot i{width:150px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
#boot i::after{content:"";display:block;width:40%;height:100%;background:var(--accent);animation:bootbar 1s ease-in-out infinite alternate}
@keyframes bootbar{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
@media (prefers-reduced-motion:reduce){#boot i::after{animation:none;width:100%}#boot{transition:none}}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#app{height:100%;display:flex}
#stage{position:relative;flex:1;min-width:0;min-height:0;background:#07090c}
#stage::before{content:"";position:absolute;inset:0 0 auto;height:calc(110px + var(--st,0px));background:linear-gradient(#05070acc,#05070a00);pointer-events:none}
#c{display:block;width:100%;height:100%;touch-action:none}
#panel{width:390px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
#tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px 12px;border-bottom:1px solid var(--line)}
#tabs button{min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:10px 1px;font:700 13px/1 var(--display);letter-spacing:0;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#pane{flex:1;overflow-y:auto;padding-block:12px calc(24px + var(--sb,0px));padding-left:12px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:9px}
.stack{display:flex;flex-direction:column;gap:8px}
#pane>.grp{background:#151a22;border:1px solid var(--line);border-radius:10px;padding:12px}
#pane>.grp>h3{color:var(--fg)}
.grp>h3{margin:0;font:700 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:9px 13px;font-size:14px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.sw input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.sl output{font-variant-numeric:tabular-nums;color:var(--ice);font-size:13px}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card b{font:700 16px/1.1 var(--display);letter-spacing:.03em}
.card small{color:var(--mute);font-size:12px}
.card svg{width:100%;height:34px;color:var(--mute)}
.card[aria-pressed="true"] svg{color:var(--accent)}
.txt{font-size:16px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.note{color:var(--mute);font-size:12.5px;margin:0}
.wide{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-weight:500}
/* HUD */
.hud{position:absolute;display:flex;gap:6px;pointer-events:none}
.hud>*{pointer-events:auto}
#hTitle{top:calc(12px + var(--st,0px));left:max(16px,env(safe-area-inset-left,0px));flex-direction:column;gap:0;pointer-events:none}
#hTitle span{font:700 12px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);text-shadow:0 1px 6px #000c;margin-bottom:4px}
#hTitle h1{margin:0;font:800 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 10px #000a}
#hTitle p{white-space:nowrap;margin:3px 0 0;font-size:13px;font-variant-numeric:tabular-nums;color:#dfe6ee;text-shadow:0 1px 6px #000c}
#hView{top:calc(12px + var(--st,0px));right:max(12px,env(safe-area-inset-right,0px));flex-direction:column;align-items:stretch}
#more{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#more .hb{justify-content:flex-start}
#bMore{display:none}
#hSound{bottom:12px;left:max(16px,env(safe-area-inset-left,0px));right:12px;align-items:center;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;background:#10151cf2;border:1.5px solid #ffffff40;border-radius:11px;padding:0 14px;font:700 15px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:#fff;white-space:nowrap;box-shadow:0 2px 10px #00000066;user-select:none;-webkit-user-select:none}
.hb em{font-style:normal}
.hb svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hb:active{transform:scale(.97)}
.hb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#more .hb::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffffff40;flex:none}
#more .hb[aria-pressed="true"]::before{background:var(--accent)}
.hb.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hb.on{background:var(--stop);border-color:var(--stop);color:#fff}
#gas{min-height:48px;padding:0 22px;font-size:17px}
@media (prefers-reduced-motion:reduce){.hb:active{transform:none}}
#rpm{flex:1;min-width:90px;max-width:260px;display:flex;flex-direction:column;gap:3px;font-size:12px;font-variant-numeric:tabular-nums;color:#dfe6ee;text-shadow:0 1px 4px #000}
#rpm i{display:block;height:5px;border-radius:3px;background:#ffffff26;overflow:hidden}
#rpm i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ice),var(--accent) 70%,var(--stop))}
/* Hintergrundbild-Dialog */
#shot{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;justify-content:center;padding:max(12px,calc(var(--st,0px) + 8px),env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,var(--sb,0px),env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#shotBox{width:min(660px,100%);height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
#shotTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
#shotTop h2{margin:0;font:800 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
#shotPrev{flex:0 0 38%;min-height:160px;display:flex;align-items:center;justify-content:center;background:#05070a;border:1px solid var(--line);border-radius:10px;padding:8px;overflow:hidden}
#shotPrev img{max-width:100%;max-height:100%;border-radius:4px;display:block}
#shotPrev img.round{border-radius:50%}
#shotMsg{margin:0;min-height:1.3em;color:var(--mute);font-size:12.5px;text-align:center}
#wtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
#wtabs button{min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:10px 1px;font:700 13px/1 var(--display);text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#wbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#wbody>.grp{background:#151a22;border:1px solid var(--line);border-radius:10px;padding:12px}
#wbody>.grp>h3{color:var(--fg)}
#shotSave{min-height:52px;font-size:18px;flex:none}
.gr{display:flex;gap:6px;align-items:center}
.gr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#install{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow:auto}
#install>div{max-width:420px;display:flex;flex-direction:column;gap:14px}
#install span{font:700 13px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#install h2{margin:0;font:800 34px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
#install p{margin:0;color:#c9d1db;font-size:15px}
#install ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
#install ol b{color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#pane>.grp,#wbody>.grp{animation:rise .26s ease-out both}
#pane>.grp:nth-child(2),#wbody>.grp:nth-child(2){animation-delay:.04s}#pane>.grp:nth-child(3),#wbody>.grp:nth-child(3){animation-delay:.08s}#pane>.grp:nth-child(4){animation-delay:.12s}#pane>.grp:nth-child(n+5){animation-delay:.16s}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.chip[aria-pressed="true"],.card[aria-pressed="true"],#tabs button[aria-selected="true"]{animation:pop .2s ease-out}
.chip,.card,#tabs button,.wide{transition:background .15s,border-color .15s,color .15s}
.chip:active,.card:active,.wide:active{transform:scale(.97)}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);margin-top:-9px;border:3px solid #0b0e13;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #0b0e13}
#toast{position:fixed;left:50%;bottom:calc(26px + var(--sb,0px));transform:translate(-50%,20px);z-index:35;background:var(--fg);color:#0b0e13;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 8px 30px #000a;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes nit{from{opacity:.55}to{opacity:1}}
#stage.nitro::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 42%,#39a0ff66 100%);animation:nit .09s linear infinite alternate}
#platePrev{width:100%;max-width:300px;border-radius:6px;display:block;margin:0 auto;box-shadow:0 4px 16px #0008}
@media (prefers-reduced-motion:reduce){#pane>.grp,#wbody>.grp,.chip[aria-pressed="true"],.card[aria-pressed="true"],#tabs button[aria-selected="true"],#stage.nitro::after{animation:none}}
.row{display:flex;gap:8px}
.row>*{flex:1}
@media (max-width:820px){
  #app{flex-direction:column}
  #stage{flex:none;height:47%}
  #panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--line)}
  #tabs{padding-left:max(12px,env(safe-area-inset-left,0px))}
  #pane{padding-left:max(12px,env(safe-area-inset-left,0px))}
  #hTitle h1{font-size:22px}
  #hTitle p{font-size:12px}
  .hb{min-height:44px;font-size:14px;padding:0 12px}
  #bMore{display:block}
  #more{display:none}
  #hView.open #more{display:flex}
  #hTitle{right:132px}
  #bShot em{display:none}
  #hTitle span{font-size:11px;letter-spacing:.14em}
  #hSound{display:grid;grid-template-columns:1.15fr 1.35fr 1fr 1fr;gap:6px;right:max(12px,env(safe-area-inset-right,0px))}
  #hSound .hb{padding:0 6px;min-width:0}
  #rpm{grid-column:1/-1;order:-1;max-width:none}
  #gas{min-height:48px;padding:0 6px;font-size:16px}
}

</style>

<div id="boot"><b>Larsens Autowerkstatt</b><span>Werkstatt wird aufgeschlossen …</span><i></i><span id="bootV"></span></div>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="3D-Ansicht deines Autos. Ziehen zum Drehen, Zoomen mit zwei Fingern oder Mausrad."></canvas>

    <div class="hud" id="hView">
      <button class="hb go" id="bShot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Bild<em> erstellen</em></span></button>
      <button class="hb" id="bMore" aria-expanded="false" aria-controls="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Ansicht</span></button>
      <div id="more">
        <button class="hb" id="bIn" aria-pressed="false">Innenraum</button>
        <button class="hb" id="bLift" aria-pressed="false">Hebebühne</button>
        <button class="hb" id="bSpin" aria-pressed="true">Drehen</button>
        <button class="hb" id="bLight" aria-pressed="true">Licht</button>
      </div>
    </div>
    <div class="hud" id="hSound">
      <button class="hb" id="bStart" aria-label="Motor starten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></svg><span>Start</span></button>
      <button class="hb go" id="gas">Gas</button>
      <button class="hb" id="bHorn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l6 4V6l-6 4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg><span>Hupe</span></button>
      <button class="hb" id="bNitro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg><span>Nitro</span></button>
      <div id="rpm" hidden><span id="rpmT">Motor aus</span><i><b id="rpmB"></b></i></div>
    </div>
  </div>
  <aside id="panel">
    <nav id="tabs" role="tablist" aria-label="Bereiche"></nav>
    <div id="pane"></div>
  </aside>
</div>

<div id="toast" role="status"></div>
<div id="install" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="instH">
    <span>Larsens Autowerkstatt</span>
    <h2 id="instH">Erst zum Homescreen hinzufügen</h2>
    <p id="instP">Die Werkstatt läuft als App im Vollbild. Füge sie einmal zu deinem Homescreen hinzu und öffne sie dann von dort.</p>

</div>

  <div id="shotBox" role="dialog" aria-modal="true" aria-labelledby="shotH">

    <div id="wtabs" role="tablist" aria-label="Foto-Einstellungen"></div>

    <button class="hb go" id="shotSave">In Galerie speichern</button>
  </div>
</div>
